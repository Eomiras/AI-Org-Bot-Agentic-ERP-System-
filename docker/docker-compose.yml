services:
  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: org_bot
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      - postgres
      - redis
      - qdrant
    volumes:
      - ../bot:/app/bot
      - ../data:/app/data
    command: python bot/main.py
    networks:
      - bot_net

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: org_worker
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      - postgres
      - redis
    volumes:
      - ../bot:/app/bot
      - ../data:/app/data
    # Arq worker command (adjust based on where the worker instance is defined)
    command: arq bot.worker.WorkerSettings
    networks:
      - bot_net

  postgres:
    image: postgres:15-alpine
    container_name: bot_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-org_bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts:/scripts
      - ../backups:/backups
    ports:
      - "5432:5432"
    networks:
      - bot_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bot_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bot_net

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: bot_qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - ../data/qdrant:/qdrant/storage
    networks:
      - bot_net

volumes:
  postgres_data:
  redis_data:

networks:
  bot_net:
    driver: bridge
